<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEXO — Digital Products</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101014;
  color: #ffffff;
  text-align: center;
}
header {
  padding: 28px 15px;
  border-bottom: 1px solid #333;
}
.logo {
  font-size: 36px;
  font-weight: bold;
  letter-spacing: 8px;
}
.tagline {
  color: #aaa;
  margin-top: 12px;
}
main {
  max-width: 600px;
  margin: 45px auto;
  padding: 20px;
}
.card {
  background: #1b1b24;
  border: 1px solid #353545;
  border-radius: 16px;
  padding: 28px 20px;
}
.badge {
  color: #b9a0ff;
  letter-spacing: 3px;
  font-size: 12px;
}
h1 { font-size: 28px; }
p {
  color: #c3c3ce;
  line-height: 1.8;
}
.price {
  font-size: 30px;
  font-weight: bold;
  margin: 25px 0;
}
button {
  background: #b9a0ff;
  color: #101014;
  border: 0;
  border-radius: 9px;
  padding: 15px 25px;
  font-size: 16px;
  font-weight: bold;
  width: 100%;
}
footer {
  color: #777;
  padding: 25px;
  font-size: 12px;
}
</style>
</head>
<body>
<header>
  <div class="logo">VEXO</div>
  <div class="tagline">Unusual ideas. Digital products.</div>
</header>

<main>
  <div class="card">
    <div class="badge">VEXO DIGITAL COLLECTION</div>
    <h1>Something Different.</h1>
    <p>
      Discover unusual digital products designed
      to make you think, laugh, or see everyday
      life differently.
    </p>
    <div class="price">Coming Soon</div>
    <button disabled>Products Coming Soon</button>
  </div>
</main>

<footer>© 2026 VEXO. All rights reserved.</footer>
</body>
</html>
